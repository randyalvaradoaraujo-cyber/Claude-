<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0f0d24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Aventura">
  <meta name="description" content="Aventura Familiar: juego de plataformas pixel-art para móviles. Joshua, Jacob, Jazzlyn y Randy contra Chrono-Corp.">
  <title>Aventura Familiar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icono-192.png">
  <link rel="apple-touch-icon" href="assets/icono-192.png">
  <style>
    :root { --fondo: #0f0d24; --texto: #fff1b8; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fondo: #0f0d24; --texto: #fff1b8; } }
    :root[data-theme="dark"] { --fondo: #0f0d24; --texto: #fff1b8; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: var(--fondo); color: var(--texto);
      overscroll-behavior: none; touch-action: none;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block; position: fixed; left: 0; top: 0;
      image-rendering: pixelated; image-rendering: crisp-edges;
      touch-action: none; outline: none;
    }
    noscript { display: block; padding: 24px; font-family: monospace; }
  </style>
</head>
<body>
  <canvas id="juego" aria-label="Aventura Familiar, juego de plataformas"></canvas>
  <noscript>Aventura Familiar necesita JavaScript para funcionar.</noscript>
  <script src="js/motor.js"></script>
  <script src="js/arte.js"></script>
  <script src="js/niveles.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/entidades.js"></script>
  <script src="js/juego.js"></script>
  <script src="js/escenas.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
